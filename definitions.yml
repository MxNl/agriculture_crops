crs_reference: 25832

# DLR CropTypes years to download, reproject and plot (2017-2024 available)
years:
  - 2017
  - 2018
  - 2019
  - 2020
  - 2021
  - 2022
  - 2023
  - 2024

# years shown as rows of maps in the grid plot (subset of years); the rank
# chart next to the grid always shows all years
grid_years:
  - 2017
  - 2020
  - 2024

# total area of Germany in km² (Destatis, as of 31.12.2023, published in the
# UBA table "Fläche und Bevölkerung"); the DLR raster cannot provide it because
# 0 is both non-farmland and outside Germany
germany_area_km2: 357683

# number of crop types with the largest area to highlight in the maps
top_n: 6

# number of crop types in the rank/area chart; every crop that reached this
# rank in at least one year is shown
ranking_top_n: 10

# rank/area chart: only ranks up to this number get a rank and area label
ranking_label_top_n: 5

# number of crop types in the change charts (largest by mean area over all
# years)
change_top_n: 6

# inclusive year ranges compared in the period change maps
change_periods:
  first: [2017, 2020]
  second: [2021, 2024]

# field sizes ------------------------------------------------------------------

# Fields of the World harmonised field boundaries (GeoParquet, latest edition):
# https://source.coop/ftw/harmonized-field-data
# One collection per state. unit says what one polygon is:
# - field: the area a farmer declared with one crop (Schlag)
# - reference parcel: a farm's contiguous area (BY Feldstück, HE Referenzparzelle)
# - field block: area within permanent borders, may hold several farms' fields
# Not covered: Baden-Württemberg (only cadastral sub-parcels), Rheinland-Pfalz
# (no data) and Mecklenburg-Vorpommern (download capped at 20,000 blocks).
field_collections:
  - {collection: de_bb, state: "Brandenburg & Berlin", short: BB, unit: field}
  - {collection: de_nds, state: "Lower Saxony, Bremen & Hamburg", short: NI, unit: field}
  - {collection: de_nrw, state: "North Rhine-Westphalia", short: NW, unit: field}
  - {collection: de_sl, state: "Saarland", short: SL, unit: field}
  - {collection: de_by_block, state: "Bavaria", short: BY, unit: reference parcel}
  - {collection: de_he, state: "Hesse", short: HE, unit: reference parcel}
  - {collection: de_sh, state: "Schleswig-Holstein", short: SH, unit: field block}
  - {collection: de_sax, state: "Saxony", short: SN, unit: field block}
  - {collection: de_st, state: "Saxony-Anhalt", short: ST, unit: field block}
  - {collection: de_th, state: "Thuringia", short: TH, unit: field block}

# field blocks of states that also publish fields, to show how much larger
# blocks are than fields (not mapped)
field_block_collections:
  - {collection: de_bb_block, state: "Brandenburg & Berlin", short: BB, unit: field block}
  - {collection: de_nds_block, state: "Lower Saxony, Bremen & Hamburg", short: NI, unit: field block}

# polygons below this size (ha) are dropped: mostly landscape elements and
# slivers; 0.1 ha is the minimum parcel size for direct payments
field_min_ha: 0.1

# map cells: hexagons of this area (km²) and minimum number of fields per cell
field_hex_km2: 25
field_min_count: 20

# scico palettes (https://www.fabiocrameri.ch/colourmaps/): field size and
# field size relative to the median
field_palette_size: lajolla
field_palette_ratio: bam
# part of the ratio palette used, symmetric around its middle (narrower for
# cyclic palettes like bamO, whose ends meet in the same colour)
field_palette_ratio_range: [0, 1]
# field edges per ha of farmland
field_palette_edges: bamako

# crop per polygon from the DLR CropTypes map of the latest year in years: the
# majority class, used where it covers at least this share of the polygon
field_crop_min_share: 0.75

# check of the DLR crops against the crops the farmers declared: editions of
# collections with fields and crops, in years covered by the DLR maps
field_crop_validation:
  - {collection: de_bb, year: 2023}
  - {collection: de_nrw, year: 2023}

# yearly editions for the time series of field sizes (collections with
# fields, all editions available on source.coop)
field_time_series:
  - {collection: de_bb, years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2026]}
  - {collection: de_nrw, years: [2019, 2020, 2021, 2022, 2023, 2026]}

# zoom windows with the real field polygons: per unit (fields, reference
# parcels, field blocks) the hexagons at these percentiles of the median field
# size, among the hexagons whose farmland share is at least
# field_zoom_min_farmland and whose fields all come from one state; window
# edge length in km
field_zoom_km: 4
field_zoom_percentiles: [0.1, 0.5, 0.9]
field_zoom_min_farmland: 0.6

# text around the plots (field size plots and crop maps): show the title,
# subtitle and caption, and align title and subtitle "center" or "left"
plot_text:
  title: true
  subtitle: true
  caption: true
  align: center
